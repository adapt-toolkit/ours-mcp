name: CI

# Gates → Conventional-Commits version bump → publish @ours.network/mcp then
# @ours.network/claude-code (strict order: the plugin's exact core dependency
# is re-pinned to the freshly bumped core version before either publishes —
# see scripts/bump-versions.sh PIN-SYNC).
#
# Prerequisites (one-time, GitHub repo settings → secrets):
#   - NPM_TOKEN: npm automation token with publish rights to the
#     @ours.network scope (covers BOTH packages).
#   - VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY: the version-bump
#     GitHub App (must be installed on this repo) so the bump commit can push
#     past branch protection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a burst of pushes doesn't queue a
# full release per commit — only the latest ref state is gated and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    name: Gates (typecheck · build · test)
    timeout-minutes: 15
    steps:
      # The packet compiles from packages/core/mufl_code/ incl. the core/
      # submodule (public repo; if it ever goes private, checkout needs an
      # org-readable token here).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile MUFL packet
        run: scripts/compile-mufl.sh
      - run: npm run typecheck
      - run: npm run build
      - name: Verify build output (compiled .muflo + bundles ship)
        run: |
          test -f packages/core/dist/index.js
          test -f packages/core/dist/cli.js
          ls packages/core/dist/mufl_code/*.muflo
          test -f packages/claude-code/dist/hooks/runner.js
      - run: npm test

  # Bumps BOTH workspace versions in one [skip ci] commit (each from
  # max(local, npm-published)), pins the plugin's core dependency, and pushes
  # back to main via a GitHub App token. Gated on gates going green.
  version-bump:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      core-version: ${{ steps.bump.outputs.core-version }}
      plugin-version: ${{ steps.bump.outputs.plugin-version }}
      hermes-version: ${{ steps.bump.outputs.hermes-version }}
      codex-version: ${{ steps.bump.outputs.codex-version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run version bump
        id: bump
        run: bash .github/workflows/scripts/bump-versions.sh

  # Publishes core then plugin from the post-bump SHA, so published versions
  # always match the committed package.json files. Only runs when the bump
  # produced a new version (re-publishing an existing version would 403).
  npm-publish:
    needs: [gates, version-bump]
    if: needs.version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    name: Publish to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Compile MUFL packet
        run: scripts/compile-mufl.sh
      - run: npm run build
      # Publish order = dependency order: core first, then the plugins that
      # pin it. `--if-present` is not a publish flag, so each is its own step; a plugin
      # whose version already exists on npm 403s, so re-runs after a partial publish would
      # fail — but the version-bump job only produces fresh versions, so every managed
      # package is new here.
      - name: Publish @ours.network/mcp
        run: npm publish --workspace @ours.network/mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/claude-code
        run: npm publish --workspace @ours.network/claude-code --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/hermes
        run: npm publish --workspace @ours.network/hermes --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/codex
        run: npm publish --workspace @ours.network/codex --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Summary
        run: |
          {
            echo "Published:"
            echo "- @ours.network/mcp@${{ needs.version-bump.outputs.core-version }}"
            echo "- @ours.network/claude-code@${{ needs.version-bump.outputs.plugin-version }}"
            echo "- @ours.network/hermes@${{ needs.version-bump.outputs.hermes-version }}"
            echo "- @ours.network/codex@${{ needs.version-bump.outputs.codex-version }}"
          } >> "$GITHUB_STEP_SUMMARY"
