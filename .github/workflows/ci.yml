name: CI

# Gates → Conventional-Commits LOCKSTEP version bump (one suite version for every
# @ours.network package + every native plugin manifest) → publish
# @ours.network/mcp then the plugins (strict order: each plugin's exact core
# dependency is re-pinned to the same suite version before anything publishes —
# see scripts/bump-versions.sh PIN-SYNC).
#
# Prerequisites (one-time, GitHub repo settings → secrets):
#   - NPM_TOKEN: npm automation token with publish rights to the
#     @ours.network scope (covers all published packages).
#   - VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY: the version-bump
#     GitHub App (must be installed on this repo) so the bump commit can push
#     past branch protection.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a burst of pushes doesn't queue a
# full release per commit — only the latest ref state is gated and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    name: Gates (typecheck · build · test)
    timeout-minutes: 15
    steps:
      # The packet compiles from packages/core/mufl_code/ incl. the core/
      # submodule (public repo; if it ever goes private, checkout needs an
      # org-readable token here).
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Compile MUFL packet
        run: scripts/compile-mufl.sh
      - run: npm run typecheck
      - run: npm run build
      - name: Verify build output (compiled .muflo + bundles ship)
        run: |
          test -f packages/core/dist/index.js
          test -f packages/core/dist/cli.js
          ls packages/core/dist/mufl_code/*.muflo
          test -f packages/claude-code/dist/hooks/runner.js
      - run: npm test

  # Bumps every managed workspace package and native plugin manifest in one
  # [skip ci] commit, pins plugin core dependencies, and pushes
  # back to main via a GitHub App token. Gated on gates going green.
  version-bump:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      unified-version: ${{ steps.bump.outputs.unified-version }}
      core-version: ${{ steps.bump.outputs.core-version }}
      plugin-version: ${{ steps.bump.outputs.plugin-version }}
      hermes-version: ${{ steps.bump.outputs.hermes-version }}
      codex-version: ${{ steps.bump.outputs.codex-version }}
      install-version: ${{ steps.bump.outputs.install-version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run version bump
        id: bump
        run: bash .github/workflows/scripts/bump-versions.sh

  # Publishes core then plugin from the post-bump SHA, so published versions
  # always match the committed package.json files. Only runs when the bump
  # produced a new version (re-publishing an existing version would 403).
  npm-publish:
    needs: [gates, version-bump]
    if: needs.version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    name: Publish to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha }}
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify Codex release metadata and npm artifact
        run: |
          core_version="$(jq -r .version packages/core/package.json)"
          codex_version="$(jq -r .version packages/codex/package.json)"
          test "$codex_version" = "$core_version"
          test "$(jq -r .version packages/codex/.codex-plugin/plugin.json)" = "$codex_version"
          test "$(jq -r '.dependencies["@ours.network/mcp"]' packages/codex/package.json)" = "$core_version"
          npm pack --workspace @ours.network/codex --dry-run --json > /tmp/ours-codex-pack.json
          node - <<'NODE'
          const pack = require('/tmp/ours-codex-pack.json')[0];
          const files = new Set(pack.files.map((entry) => entry.path));
          for (const path of [
            '.codex-plugin/plugin.json', '.mcp.json', 'hooks/hooks.json',
            'bin/ours-codex.mjs', 'bin/monitor-mcp.mjs', 'bin/proxy.mjs',
            'src/monitor-mcp.mjs', 'src/launcher.mjs', 'skills/ours/SKILL.md',
            'install.sh', 'README.md', 'LICENSE',
          ]) {
            if (!files.has(path)) throw new Error(`@ours.network/codex package is missing ${path}`);
          }
          NODE
      - name: Verify install artifact ships the ours-install bin + files
        run: |
          npm pack --workspace @ours.network/install --dry-run --json > /tmp/ours-install-pack.json
          node - <<'NODE'
          const pack = require('/tmp/ours-install-pack.json')[0];
          const files = new Set(pack.files.map((entry) => entry.path));
          for (const path of [
            'install.mjs', 'install.sh', 'lib/ui.mjs', 'lib/logic.mjs', 'lib/prompt.mjs',
            'uninstall.mjs', 'uninstall.sh', 'README.md', 'LICENSE',
          ]) {
            if (!files.has(path)) throw new Error(`@ours.network/install package is missing ${path}`);
          }
          const pkg = require(`${process.cwd()}/packages/installer/package.json`);
          if (pkg.bin['ours-install'] !== 'install.mjs') throw new Error('@ours.network/install must expose the ours-install bin');
          NODE
      - name: Compile MUFL packet
        run: scripts/compile-mufl.sh
      - run: npm run build
      # Publish order = dependency order: core first, then the plugins that
      # pin it. `--if-present` is not a publish flag, so each is its own step; a plugin
      # whose version already exists on npm 403s, so re-runs after a partial publish would
      # fail — but the version-bump job only produces fresh versions, so every managed
      # package is new here.
      - name: Publish @ours.network/mcp
        run: npm publish --workspace @ours.network/mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/claude-code
        run: npm publish --workspace @ours.network/claude-code --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/hermes
        run: npm publish --workspace @ours.network/hermes --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/codex
        run: npm publish --workspace @ours.network/codex --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/install
        run: npm publish --workspace @ours.network/install --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Summary
        run: |
          {
            echo "Published (lockstep v${{ needs.version-bump.outputs.unified-version }}):"
            echo "- @ours.network/mcp@${{ needs.version-bump.outputs.core-version }}"
            echo "- @ours.network/claude-code@${{ needs.version-bump.outputs.plugin-version }}"
            echo "- @ours.network/hermes@${{ needs.version-bump.outputs.hermes-version }}"
            echo "- @ours.network/codex@${{ needs.version-bump.outputs.codex-version }}"
            echo "- @ours.network/install@${{ needs.version-bump.outputs.install-version }}"
            echo "- plugin manifests (.claude-plugin/plugin.json) at v${{ needs.version-bump.outputs.unified-version }}"
          } >> "$GITHUB_STEP_SUMMARY"
