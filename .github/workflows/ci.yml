name: CI

# Gates → Conventional-Commits LOCKSTEP version bump (one suite version for every
# @ours.network package + every native plugin manifest) → publish
# @ours.network/mcp then the plugins (strict order: each plugin's exact core
# dependency is re-pinned to the same suite version before anything publishes —
# see scripts/bump-versions.sh PIN-SYNC).
#
# Prerequisites (one-time, GitHub repo settings → secrets):
#   - NPM_TOKEN: npm automation token with publish rights to the
#     @ours.network scope (covers all published packages).
#   - VERSION_BUMP_APP_ID / VERSION_BUMP_APP_PRIVATE_KEY: the version-bump
#     GitHub App (must be installed on this repo) so the bump commit can push
#     past branch protection.

on:
  push:
    # main       → stable @latest (bump → publish; unchanged legacy flow).
    # prerelease → nightly: publish the npm `nightly` tag ONLY, with ephemeral
    #              -nightly.N versions. The two paths are branch-exclusive and a
    #              nightly can NEVER move @latest (see scripts/publish-guard.sh).
    branches: [main, prerelease]
  pull_request:
    branches: [main, prerelease]
  workflow_dispatch:

# Cancel superseded runs on the same ref so a burst of pushes doesn't queue a
# full release per commit — only the latest ref state is gated and published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    name: Gates (typecheck · build · test)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify build output
        run: |
          test -f packages/core/dist/connector.js
          test -f packages/core/dist/cli.js
          test -f packages/claude-code/dist/hooks/runner.js
      - run: npm test

  # Bumps every managed workspace package and native plugin manifest in one
  # [skip ci] commit, pins plugin core dependencies, and pushes
  # back to main via a GitHub App token. Gated on gates going green.
  version-bump:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Version bump
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      bumped: ${{ steps.bump.outputs.bumped }}
      new-sha: ${{ steps.bump.outputs.new-sha }}
      unified-version: ${{ steps.bump.outputs.unified-version }}
      core-version: ${{ steps.bump.outputs.core-version }}
      plugin-version: ${{ steps.bump.outputs.plugin-version }}
      hermes-version: ${{ steps.bump.outputs.hermes-version }}
      codex-version: ${{ steps.bump.outputs.codex-version }}
      install-version: ${{ steps.bump.outputs.install-version }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VERSION_BUMP_APP_ID }}
          private-key: ${{ secrets.VERSION_BUMP_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Run version bump
        id: bump
        run: bash .github/workflows/scripts/bump-versions.sh

  # Publishes core then plugin from the post-bump SHA, so published versions
  # always match the committed package.json files. Only runs when the bump
  # produced a new version (re-publishing an existing version would 403).
  npm-publish:
    needs: [gates, version-bump]
    if: needs.version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    name: Publish to npm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version-bump.outputs.new-sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Verify Codex release metadata and npm artifact
        run: |
          core_version="$(jq -r .version packages/core/package.json)"
          codex_version="$(jq -r .version packages/codex/package.json)"
          test "$codex_version" = "$core_version"
          test "$(jq -r .version packages/codex/.codex-plugin/plugin.json)" = "$codex_version"
          test "$(jq -r '.dependencies["@ours.network/mcp"]' packages/codex/package.json)" = "$core_version"
          npm pack --workspace @ours.network/codex --dry-run --json > /tmp/ours-codex-pack.json
          node - <<'NODE'
          const pack = require('/tmp/ours-codex-pack.json')[0];
          const files = new Set(pack.files.map((entry) => entry.path));
          for (const path of [
            '.codex-plugin/plugin.json', '.mcp.json', 'hooks/hooks.json',
            'bin/ours-codex.mjs', 'bin/monitor-mcp.mjs', 'bin/proxy.mjs',
            'src/monitor-mcp.mjs', 'src/launcher.mjs', 'skills/ours/SKILL.md',
            'install.sh', 'README.md', 'LICENSE',
          ]) {
            if (!files.has(path)) throw new Error(`@ours.network/codex package is missing ${path}`);
          }
          NODE
      - name: Verify install artifact ships the ours-install bin + files
        run: |
          npm pack --workspace @ours.network/install --dry-run --json > /tmp/ours-install-pack.json
          node - <<'NODE'
          const pack = require('/tmp/ours-install-pack.json')[0];
          const files = new Set(pack.files.map((entry) => entry.path));
          for (const path of [
            'install.mjs', 'install.sh', 'lib/ui.mjs', 'lib/logic.mjs', 'lib/prompt.mjs',
            'uninstall.mjs', 'uninstall.sh', 'README.md', 'LICENSE',
          ]) {
            if (!files.has(path)) throw new Error(`@ours.network/install package is missing ${path}`);
          }
          const pkg = require(`${process.cwd()}/packages/installer/package.json`);
          if (pkg.bin['ours-install'] !== 'install.mjs') throw new Error('@ours.network/install must expose the ours-install bin');
          NODE
      - run: npm run build
      # FAIL-CLOSED before ANY stable publish: asserts we are on main and every managed
      # package carries a clean X.Y.Z (no pre-release suffix). A nightly build can never
      # reach this job (branch-gated), and if one somehow did, the guard refuses to publish.
      - name: Fail-closed stable guard (branch=main, clean version, @latest)
        run: |
          for p in packages/core packages/claude-code packages/hermes packages/codex packages/installer; do
            bash .github/workflows/scripts/publish-guard.sh stable "$p/package.json" latest
          done
      # Publish order = dependency order: core first, then the plugins that
      # pin it. `--if-present` is not a publish flag, so each is its own step; a plugin
      # whose version already exists on npm 403s, so re-runs after a partial publish would
      # fail — but the version-bump job only produces fresh versions, so every managed
      # package is new here.
      - name: Publish @ours.network/mcp
        run: npm publish --workspace @ours.network/mcp --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/claude-code
        run: npm publish --workspace @ours.network/claude-code --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/hermes
        run: npm publish --workspace @ours.network/hermes --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/codex
        run: npm publish --workspace @ours.network/codex --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/install
        run: npm publish --workspace @ours.network/install --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Summary
        run: |
          {
            echo "Published (lockstep v${{ needs.version-bump.outputs.unified-version }}):"
            echo "- @ours.network/mcp@${{ needs.version-bump.outputs.core-version }}"
            echo "- @ours.network/claude-code@${{ needs.version-bump.outputs.plugin-version }}"
            echo "- @ours.network/hermes@${{ needs.version-bump.outputs.hermes-version }}"
            echo "- @ours.network/codex@${{ needs.version-bump.outputs.codex-version }}"
            echo "- @ours.network/install@${{ needs.version-bump.outputs.install-version }}"
            echo "- plugin manifests (.claude-plugin/plugin.json) at v${{ needs.version-bump.outputs.unified-version }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # NIGHTLY channel — runs ONLY on push to prerelease. Computes an ephemeral
  # -nightly.N suite version at CI time (never committed), then publishes each
  # managed package to the npm `nightly` tag behind the fail-closed guard. This
  # job is branch-exclusive with version-bump/npm-publish (main), so a nightly
  # can never run the stable path and can never move @latest.
  nightly-publish:
    needs: gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/prerelease'
    runs-on: ubuntu-latest
    name: Publish nightly to npm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # Set the ephemeral -nightly.N version across the suite (package.jsons +
      # plugin manifests + internal pins). NOT committed — lives only in this
      # runner's working tree for the publish steps below.
      - name: Compute + set nightly version
        id: nightly
        run: OURS_RELEASE_MODE=nightly bash .github/workflows/scripts/bump-versions.sh
      - run: npm run build
      - name: Verify build output
        run: |
          test -f packages/core/dist/connector.js
          test -f packages/core/dist/cli.js
          test -f packages/claude-code/dist/hooks/runner.js
      # Each publish goes through publish-nightly.sh, which runs the fail-closed
      # guard (version must be -nightly.N) and then `npm publish --tag nightly`
      # atomically. Publish order = dependency order (core first, then pinners).
      - name: Publish @ours.network/mcp (nightly)
        run: bash .github/workflows/scripts/publish-nightly.sh @ours.network/mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/claude-code (nightly)
        run: bash .github/workflows/scripts/publish-nightly.sh @ours.network/claude-code
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/hermes (nightly)
        run: bash .github/workflows/scripts/publish-nightly.sh @ours.network/hermes
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/codex (nightly)
        run: bash .github/workflows/scripts/publish-nightly.sh @ours.network/codex
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @ours.network/install (nightly)
        run: bash .github/workflows/scripts/publish-nightly.sh @ours.network/install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # Post-publish safety proof: nightly tag advanced, @latest UNCHANGED.
      # npm's registry/CDN can lag a few seconds behind a publish, so poll the
      # nightly tag with backoff before asserting. The @latest check needs no
      # retry — it must ALREADY be a clean version the instant we look.
      - name: Verify dist-tags (nightly moved, @latest untouched)
        run: |
          v="${{ steps.nightly.outputs.unified-version }}"
          for n in @ours.network/mcp @ours.network/claude-code @ours.network/hermes @ours.network/codex @ours.network/install; do
            nightly_tag=""
            for attempt in 1 2 3 4 5 6 7 8; do
              nightly_tag="$(npm view "$n" dist-tags.nightly --registry=https://registry.npmjs.org 2>/dev/null || echo '')"
              [ "$nightly_tag" = "$v" ] && break
              echo "  ($n nightly tag not yet '$v' — got '${nightly_tag:-<empty>}', retry $attempt/8)"
              sleep 10
            done
            latest_tag="$(npm view "$n" dist-tags.latest --registry=https://registry.npmjs.org 2>/dev/null || echo '')"
            echo "$n -> nightly=$nightly_tag latest=$latest_tag"
            test "$nightly_tag" = "$v" || { echo "::error::$n nightly tag is '$nightly_tag', expected '$v' after retries"; exit 1; }
            case "$latest_tag" in *-*) echo "::error::$n @latest '$latest_tag' carries a pre-release suffix"; exit 1 ;; esac
            test -n "$latest_tag" || { echo "::error::$n @latest is empty (unexpected)"; exit 1; }
          done
      - name: Summary
        run: |
          {
            echo "Published nightly (lockstep ${{ steps.nightly.outputs.unified-version }}) to the \`nightly\` tag:"
            echo "- @ours.network/mcp@${{ steps.nightly.outputs.core-version }}"
            echo "- @ours.network/claude-code@${{ steps.nightly.outputs.plugin-version }}"
            echo "- @ours.network/hermes@${{ steps.nightly.outputs.hermes-version }}"
            echo "- @ours.network/codex@${{ steps.nightly.outputs.codex-version }}"
            echo "- @ours.network/install@${{ steps.nightly.outputs.install-version }}"
            echo "- @latest is unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
